version: '3.8'

services:
  valkey:
    image: valkey/valkey:7.2
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shirataki-net

  # SSE Server
  sse-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://valkey:6379/0
      - REDIS_STREAM_KEY=transcription_stream
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - DEBUG=true
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./lib:/app/lib:ro
      - ./public:/app/public:ro
      - ./config.ru:/app/config.ru:ro
    command: ["bundle", "exec", "falcon", "serve", "-b", "http://0.0.0.0:3000"]
    networks:
      - shirataki-net

  # RTMP to Transcribe Service
  rtmp-transcribe:
    build: .
    environment:
      - RTMP_URL=rtmp://0.0.0.0:1935/live
      - REDIS_URL=redis://valkey:6379/0
      - REDIS_STREAM_KEY=transcription_stream
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - TRANSCRIBE_LANGUAGE=${TRANSCRIBE_LANGUAGE}
      - ROOM=default
      - DEBUG=true
    depends_on:
      - valkey
    ports:
      - "1935:1935"
    volumes:
      - ./lib:/app/lib:ro
      - ./bin:/app/bin:ro
    command: ["ruby", "bin/rtmp_transcribe_server.rb"]
    restart: unless-stopped
    networks:
      - shirataki-net

  # test
  ffmpeg-audio-stream:
    build: .
    environment:
      - RTMP_URL=rtmp://0.0.0.0:1935/live
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
    command: ["ruby", "lib/ffmpeg_audio_stream.rb"]
    ports:
      - "1935:1935"
    volumes:
      - ./lib:/app/lib:ro
    depends_on:
      - otel-collector
    networks:
      - shirataki-net

  # Optional: Redis Commander for GUI management
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:valkey:6379
    ports:
      - "8081:8081"
    depends_on:
      - valkey
    networks:
      - shirataki-net

  mimir:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    ports:
      - "9009:9009"
    volumes:
      - ./mimir.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/tmp/mimir
    networks:
      - shirataki-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9009/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - MIMIR_STORAGE_BACKEND=${MIIMIR_STORAGE_BACKEND:-filesystem}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - ./otel/collector.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - mimir
    networks:
      - shirataki-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - mimir
    networks:
      - shirataki-net

networks:
  shirataki-net:
    driver: bridge

volumes:
  valkey-data:
    driver: local
  mimir-data:
    driver: local
  grafana-data:
    driver: local
